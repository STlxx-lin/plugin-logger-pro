name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build-and-release:
    name: Build & Release NocoBase Plugin
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          path: packages/plugins/@nocobase/plugin-logger-pro

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate Root package.json
        run: |
          cat << 'EOF' > package.json
          {
            "name": "nocobase-build-env",
            "private": true,
            "workspaces": [
              "packages/*/*",
              "packages/*/*/*"
            ],
            "scripts": {
              "nocobase": "nocobase-v1"
            },
            "dependencies": {
              "@nocobase/app": "2.2.0-beta.15",
              "@nocobase/cli": "2.2.0-beta.15",
              "@nocobase/build": "2.2.0-beta.15",
              "@nocobase/devtools": "2.2.0-beta.15"
            },
            "resolutions": {
              "cytoscape": "3.28.0",
              "@types/react": "18.3.18",
              "@types/react-dom": "^18.0.0",
              "react-router-dom": "^6.30.1",
              "react-router": "^6.30.1",
              "antd": "5.24.2",
              "async": "^3.2.6",
              "rollup": "4.24.0",
              "semver": "^7.7.1"
            }
          }
          EOF

      - name: Generate Configuration Files
        run: |
          cat << 'EOF' > lerna.json
          {
            "version": "0.1.0",
            "npmClient": "yarn",
            "useWorkspaces": true
          }
          EOF
          cat << 'EOF' > tsconfig.json
          {
            "extends": "./tsconfig.paths.json",
            "compilerOptions": {
              "esModuleInterop": true,
              "moduleResolution": "node",
              "jsx": "react",
              "target": "esnext",
              "module": "esnext",
              "allowJs": true,
              "noUnusedLocals": false,
              "preserveConstEnums": true,
              "skipLibCheck": true,
              "sourceMap": true,
              "inlineSources": true,
              "resolveJsonModule": true,
              "declaration": true,
              "experimentalDecorators": true,
              "downlevelIteration": true,
              "baseUrl": "."
            },
            "exclude": [
              "node_modules",
              "**/dist",
              "**/lib",
              "**/*.js",
              "**/*.d.ts"
            ]
          }
          EOF
          cat << 'EOF' > tsconfig.paths.json
          {
            "compilerOptions": {
              "paths": {
                "@nocobase/plugin-logger-pro/client": [
                  "packages/plugins/@nocobase/plugin-logger-pro/src/client"
                ],
                "@nocobase/plugin-logger-pro/client-v2": [
                  "packages/plugins/@nocobase/plugin-logger-pro/src/client-v2"
                ],
                "@nocobase/plugin-logger-pro/package.json": [
                  "packages/plugins/@nocobase/plugin-logger-pro/package.json"
                ],
                "@nocobase/plugin-logger-pro": [
                  "packages/plugins/@nocobase/plugin-logger-pro/src"
                ]
              }
            }
          }
          EOF

      - name: Create Env Files
        run: |
          touch .env
          touch .env.example
          touch .env.e2e.example
          touch .env.test.example

      - name: Install Dependencies
        run: yarn install

      - name: Get Plugin Version
        id: plugin_version
        run: |
          VERSION=$(node -p "require('./packages/plugins/@nocobase/plugin-logger-pro/package.json').version")
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "RELEASE_VERSION=${VERSION}" >> $GITHUB_ENV
          mkdir -p /tmp/release-artifacts

      - name: Build & Package Plugin
        run: |
          yarn nocobase build @nocobase/plugin-logger-pro
          
          cd packages/plugins/@nocobase/plugin-logger-pro
          
          # 打印调试信息并检测 dist 是否存在
          echo "=== Build File List ==="
          ls -la
          if [ ! -d "dist" ]; then
            echo "ERROR: dist directory not found in plugin workspace!"
            exit 1
          else
            echo "dist directory found. Printing contents:"
            ls -la dist
          fi
          
          # 打包发布产物 tgz 与 zip（排除源码与临时文件）
          tar -czvf "/tmp/release-artifacts/plugin-logger-pro-v${RELEASE_VERSION}.tgz" \
            --exclude="node_modules" \
            --exclude=".git" \
            --exclude=".github" \
            --exclude="storage" \
            --exclude="docs" \
            --exclude="src" \
            *
            
          zip -r "/tmp/release-artifacts/plugin-logger-pro-v${RELEASE_VERSION}.zip" * \
            -x "node_modules/*" ".git/*" ".github/*" "storage/*" "docs/*" "src/*"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.plugin_version.outputs.version) }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || format('Release v{0}', steps.plugin_version.outputs.version) }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            /tmp/release-artifacts/plugin-logger-pro-v*.tgz
            /tmp/release-artifacts/plugin-logger-pro-v*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
