name: 💡 Feature Request / 功能建议
description: Suggest an idea or feature for Logger Pro / 为插件提出新功能或改进建议
title: '[Feature]: '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        感谢您为 Logger Pro 提出建设性建议！
  - type: textarea
    id: problem
    attributes:
      label: 🤔 您遇到的痛点或需求场景 / Problem & Use Case
      description: 当前缺少什么功能？或者希望解决什么具体痛点？
      placeholder: 例如：希望支持将慢查询日志通过企业微信机器人推送告警...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: ✨ 期望的解决方案 / Proposed Solution
      description: 请详细描述您期望实现的功能交互或技术方案。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 🔍 替代方案 / Alternative Solutions
      description: 您是否考虑过其他替代方案或变通方法？
  - type: textarea
    id: additional-context
    attributes:
      label: 📌 补充信息 / Additional Context
      description: 其他任何有助于理解该需求的上下文、参考文档或截图。
