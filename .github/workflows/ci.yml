name: Continuous Integration

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'src/**'
      - 'package.json'
      - 'tsconfig.json'
      - 'build.config.ts'
      - '.github/workflows/ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'package.json'
      - 'tsconfig.json'
      - 'build.config.ts'

jobs:
  build-and-test:
    name: Build & Verify Plugin
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          path: packages/plugins/@nocobase/plugin-logger-pro

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate Root package.json
        run: |
          cat << 'EOF' > package.json
          {
            "name": "nocobase-build-env",
            "private": true,
            "workspaces": [
              "packages/*/*",
              "packages/*/*/*"
            ],
            "scripts": {
              "nocobase": "nocobase-v1"
            },
            "dependencies": {
              "@nocobase/app": "2.2.0-beta.15",
              "@nocobase/cli": "2.2.0-beta.15",
              "@nocobase/build": "2.2.0-beta.15",
              "@nocobase/devtools": "2.2.0-beta.15"
            },
            "resolutions": {
              "cytoscape": "3.28.0",
              "@types/react": "18.3.18",
              "@types/react-dom": "^18.0.0",
              "react-router-dom": "^6.30.1",
              "react-router": "^6.30.1",
              "antd": "5.24.2",
              "async": "^3.2.6",
              "rollup": "4.24.0",
              "semver": "^7.7.1"
            }
          }
          EOF

      - name: Generate Configuration Files
        run: |
          cat << 'EOF' > lerna.json
          {
            "version": "0.1.0",
            "npmClient": "yarn",
            "useWorkspaces": true
          }
          EOF
          cat << 'EOF' > tsconfig.json
          {
            "extends": "./tsconfig.paths.json",
            "compilerOptions": {
              "esModuleInterop": true,
              "moduleResolution": "node",
              "jsx": "react",
              "target": "esnext",
              "module": "esnext",
              "allowJs": true,
              "noUnusedLocals": false,
              "preserveConstEnums": true,
              "skipLibCheck": true,
              "sourceMap": true,
              "inlineSources": true,
              "resolveJsonModule": true,
              "declaration": true,
              "experimentalDecorators": true,
              "downlevelIteration": true,
              "baseUrl": "."
            },
            "exclude": [
              "node_modules",
              "**/dist",
              "**/lib",
              "**/*.js",
              "**/*.d.ts"
            ]
          }
          EOF
          cat << 'EOF' > tsconfig.paths.json
          {
            "compilerOptions": {
              "paths": {
                "@nocobase/plugin-logger-pro/client": [
                  "packages/plugins/@nocobase/plugin-logger-pro/src/client"
                ],
                "@nocobase/plugin-logger-pro/client-v2": [
                  "packages/plugins/@nocobase/plugin-logger-pro/src/client-v2"
                ],
                "@nocobase/plugin-logger-pro/package.json": [
                  "packages/plugins/@nocobase/plugin-logger-pro/package.json"
                ],
                "@nocobase/plugin-logger-pro": [
                  "packages/plugins/@nocobase/plugin-logger-pro/src"
                ]
              }
            }
          }
          EOF

      - name: Create Env Files
        run: |
          touch .env
          touch .env.example
          touch .env.e2e.example
          touch .env.test.example

      - name: Install Dependencies with Retry
        run: |
          yarn config set network-timeout 600000
          yarn config set registry https://registry.npmjs.org/
          
          n=0
          until [ "$n" -ge 4 ]
          do
            echo "Running yarn install (attempt $((n+1)))..."
            yarn install --network-timeout 600000 && break
            n=$((n+1))
            if [ "$n" -lt 4 ]; then
              echo "yarn install failed due to network/registry glitch, retrying in 5 seconds..."
              sleep 5
            else
              echo "ERROR: yarn install failed after 4 attempts."
              exit 1
            fi
          done

      - name: Build Plugin
        run: yarn nocobase build @nocobase/plugin-logger-pro

      - name: Verify Build Artifacts
        run: |
          cd packages/plugins/@nocobase/plugin-logger-pro
          echo "Checking essential files..."
          test -f "server.js" || { echo "ERROR: server.js is missing!"; exit 1; }
          test -f "client.js" || { echo "ERROR: client.js is missing!"; exit 1; }
          test -f "dist/server/index.js" || { echo "ERROR: dist/server/index.js is missing!"; exit 1; }
          test -f "dist/client/index.js" || { echo "ERROR: dist/client/index.js is missing!"; exit 1; }
          echo "All verification checks passed successfully!"
